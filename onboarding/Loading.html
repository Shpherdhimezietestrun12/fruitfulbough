<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Balancing</title>
    <link rel="icon" type="image/x-icon" href="../icons/FB-Stream.png">
    <link rel="icon" type="image/x-icon" href="../icons/FB-Stream.png">
    <meta name="description" content="Customise your interest and select the Fruitful Bough page you want to start with today.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,800&family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
         :root {
            --bg: oklch(0 0 0);
            --panel: oklch(.174 .013 88);
            --panel-2: oklch(.22 .016 88);
            --ink: oklch(.91 .012 85);
            --muted: oklch(.662 .036 85);
            --gold: oklch(.845 .17 88);
            --gold-light: oklch(.899 .131 90);
            --gold-deep: oklch(.687 .143 77);
            --gold-soft: oklch(.845 .17 88 / .12);
            --border: oklch(.845 .17 88 / .14);
            --border-hover: oklch(.845 .17 88 / .5);
            --nav: oklch(0 0 0 / .7);
            --button-ink: var(--bg);
            --button-gradient: linear-gradient(135deg, var(--gold-light), var(--gold) 45%, var(--gold-deep));
            --glow: 0 0 14px oklch(.845 .17 88 / .45), inset 0 0 8px oklch(.845 .17 88 / .15);
            --active-glow: 0 0 0 1px var(--gold), 0 0 24px -4px oklch(.845 .17 88 / .55)
        }
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0
        }
        
        body {
            background: var(--bg);
            background-image: radial-gradient(60% 40% at 50% 0%, oklch(.845 .17 88 / .12), transparent 70%);
            background-attachment: fixed;
            color: var(--ink);
            font-family: Manrope, sans-serif;
            line-height: 1.6;
            min-height: 100vh
        }
        
        .loading-div-sh {
            top: 0;
            left: 0;
            position: fixed;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.70);
            z-index: 50;
            display: block;
        }
        
        .load-container {
            width: 120px;
            height: 120px;
            top: 50%;
            left: 50%;
            position: absolute;
            transform: translate(-50%, -50%);
            background-color: transparent;
        }
        
        .load-seq {
            width: 50px;
            height: 50px;
            top: 50%;
            left: 50%;
            position: relative;
            transform: translate(-50%, -50%);
            background-color: transparent;
            border-radius: 50px;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 3px solid transparent;
            animation: drawBox 3s linear infinite;
        }
        /* Animation draws from 0 to 100% in building  */
        
        @keyframes drawBox {
            0% {
                border-top-color: transparent;
                border-right-color: transparent;
                border-bottom-color: transparent;
                border-left-color: transparent;
            }
            25% {
                border-top-color: orange;
                border-right-color: transparent;
                border-bottom-color: transparent;
                border-left-color: transparent;
            }
            50% {
                border-top-color: orange;
                border-right-color: orange;
                border-bottom-color: transparent;
                border-left-color: transparent;
            }
            75% {
                border-top-color: orange;
                border-right-color: orange;
                border-bottom-color: orange;
                border-left-color: transparent;
            }
            100% {
                border-top-color: orange;
                border-right-color: orange;
                border-bottom-color: orange;
                border-left-color: orange;
            }
        }
        
        .img-presenting {
            zoom: 22%;
        }
        
        .div-load-par {
            width: 200px;
            height: 27px;
            background-color: transparent;
            bottom: 0;
            left: 50%;
            transform: translate(-50%, -50%);
            position: absolute;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .server-com {
            font-size: 12px;
            color: rgb(223, 223, 223);
            font-family: "Cabri ", sans-serif;
        }
        /* optional blinking cursor effect */
        
        .sp-count-12::after {
            content: '';
            animation: blink 0.7s step-end infinite;
        }
        
        @keyframes blink {
            50% {
                opacity: 0;
            }
        }
        
        .div-cont-upload {
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.70);
            position: fixed;
            top: 0;
            display: block;
            left: 0;
        }
    </style>
</head>

<body>

    <div class="loading-div-sh">
        <div class="load-container">
            <div class="load-seq">
                <img src="../icons/fb_logo-qqss.png" class="img-presenting"></div>
        </div>
        <div class="div-load-par">
        </div>
        <script>
            // Start server loop 
            document.addEventListener('DOMContentLoaded', () => {
                const el = document.querySelector('.sp-count-12');

                const message = "......."; // 

                const typeSpeed = 80; // ms per character while typing
                const pauseAfterTyping = 1300; // ms to pause once fully typed
                const pauseBeforeRestart = 700; // ms pause on empty before typing again

                let charIndex = 0;

                function typeLoop() {
                    if (charIndex <= message.length) {
                        el.textContent = message.slice(0, charIndex);
                        charIndex++;
                        setTimeout(typeLoop, typeSpeed);
                    } else {
                        // finished typing, pause, then clear and restart from the first character
                        setTimeout(() => {
                            el.textContent = '';
                            charIndex = 0;
                            setTimeout(typeLoop, pauseBeforeRestart);
                        }, pauseAfterTyping);
                    }
                }

                typeLoop();
            });
        </script>
    </div>
</body>

</html>
